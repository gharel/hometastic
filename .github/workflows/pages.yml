name: Publication sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url || steps.publication-2.outputs.page_url || steps.publication-3.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:e2e
      # Build publié : avec le projet Firebase du foyer (valeurs publiques, variables du dépôt).
      # Sans ces variables, l’app reste en mode local seul.
      - run: npm run build
        env:
          VITE_FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG }}
          VITE_FIREBASE_VAPID: ${{ vars.FIREBASE_VAPID }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      # deploy-pages ne trouve parfois pas l'archive qui vient d'être envoyée : on retente après 20 s, puis 60 s.
      - name: Publier
        id: publication
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Patienter avant un deuxième essai
        if: steps.publication.outcome == 'failure'
        run: sleep 20
      - name: Publier (2e essai)
        id: publication-2
        if: steps.publication.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Patienter avant un troisième essai
        if: steps.publication-2.outcome == 'failure'
        run: sleep 60
      - name: Publier (3e essai)
        id: publication-3
        if: steps.publication-2.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
