<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="darkreader-lock" />
    <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111419" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="Hometastic, l’application du foyer : courses, tâches, maison, voitures, enfants, voyages."
    />
    <meta name="apple-mobile-web-app-title" content="Hometastic" />
    <title>Hometastic</title>
    <script>
      // Thème avant le premier affichage, seulement pour un choix explicite (sinon celui du système).
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem('skazy-outils:theme'));
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
